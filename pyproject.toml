[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg10"
version = "0.1.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# The reused rPPG-Toolbox is NumPy-1.x-era code that calls np.mat (np.matrix),
# which emits a PendingDeprecationWarning from numpy's defmatrix.py on every
# method call. We pin numpy<2 and reuse the toolbox as-is, so this upstream
# noise is expected and unactionable. Filter ONLY that exact message so any
# other (including our own) warnings still surface.
filterwarnings = [
    "ignore:the matrix subclass is not the recommended way:PendingDeprecationWarning",
]
